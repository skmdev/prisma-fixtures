name: Publish to npm
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check release version
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: node .github/scripts/release.cjs
      - run: npm install --global npm@11
      - run: npm ci
      - name: Record current stable channel
        id: registry
        run: echo "latest=$(npm view @skmdev/prisma-fixtures dist-tags.latest)" >> "$GITHUB_OUTPUT"
      - name: Publish package
        run: npm publish --access public --tag "$RELEASE_CHANNEL"
        env:
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
      - name: Verify registry channels and installed package
        env:
          RELEASE_CHANNEL: ${{ steps.release.outputs.channel }}
          PREVIOUS_LATEST: ${{ steps.registry.outputs.latest }}
        run: |
          node -e 'const assert = require("node:assert/strict"); const { execFileSync } = require("node:child_process"); const { name, version } = require("./package.json"); const tags = JSON.parse(execFileSync("npm", ["view", name, "dist-tags", "--json"], { encoding: "utf8" })); assert.equal(tags[process.env.RELEASE_CHANNEL], version); if (process.env.RELEASE_CHANNEL === "next") assert.equal(tags.latest, process.env.PREVIOUS_LATEST)'
          npm run test:integration -- --published
